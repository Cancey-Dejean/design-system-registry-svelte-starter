version: 2
updates:
  - package-ecosystem: "bun"
    directory: "/"
    schedule:
      interval: "weekly"
    cooldown:
      default-days: 7
    groups:
      # Update Vite+, its Vite alias, and Vitest runner/providers together.
      toolchain:
        patterns:
          - "vite-plus"
          - "vite"
          - "@voidzero-dev/vite-plus-core"
          - "vitest"
          - "@vitest/*"
      sveltekit:
        patterns:
          - "@sveltejs/*"
          - "svelte"
          - "svelte-check"
      storybook:
        patterns:
          - "storybook"
          - "@storybook/*"
          - "@chromatic-com/storybook"
      minor-and-patch:
        update-types: ["minor", "patch"]
    ignore:
      # Kit's sync and svelte-check require the compiler API absent from TS 7.
      # Revisit when those integrations support the native compiler API.
      - dependency-name: "typescript"
        update-types: ["version-update:semver-major"]
